llm:
  # Primary LLM provider: Vertex AI / Gemini
  primary:
    provider: "vertex_ai"
    project_id: "your-gcp-project-id"
    location: "global"
    model_name: "gemini-2.5-flash"
  
  # Backup LLM provider if Primary fails
  backup:
    provider: "openai"
    api_key: "your-backup-openai-api-key"
    base_url: "https://api.openai.com/v1"
    model_name: "gpt-4o-mini"

bot:
  my_name: "YourName"
  # 白名單聯絡人或群組名稱列表
  whitelist:
    - "FriendA"
    - "WorkGroup"

  # 預設系統 Prompt
  default_system_prompt: |
    你是我（YourName）的 LINE AI 助理。
    請閱讀下方對話紀錄，回覆對方的最新訊息。
    要求：
    1. 語氣親切自然。
    2. 如果最後一條訊息是我自己發出的，請僅回傳 "[NO_REPLY]"。
    3. 直接輸出回覆文字內容，請勿包含引號、註解或 Markdown 區塊標記。

  # 各別對象擴充 Prompt
  contact_prompts:
    "FriendA": |
      這是我的好友，說話輕鬆親切帶點幽默。

ui:
  detection_mode: "hybrid" # 辨識模式: "hybrid" (推薦: 綠色色塊 248~356px + 樣板雙重判定), "color_blob" (純色塊), "template" (純樣板)
  green_blob_min_area: 248 # 綠點色塊最小面積 (像素)
  green_blob_max_area: 356 # 綠點色塊最大面積 (像素)
  green_dot_confidence: 0.65
  green_dot_template_path: "assets/green_dot_white_x.png"
  response_delay_min: 1.5
  response_delay_max: 3.0
  max_retries: 3

environment:
  auto_recover: true             # 是否開啟自動恢復 (Chrome 崩潰/黑屏時自動拉起)
  max_recover_attempts: 3        # 最大重試次數
  recover_cooldown_sec: 10       # 恢復冷卻時間 (秒)
  display: ":99"                 # X11 Display
  chrome_bin: "google-chrome"    # Chrome 執行檔名稱或絕對路徑
  line_extension_id: "ophjlpahpchlmihnnnihgmmeilfjmjjc"  # LINE Chrome 擴充套件 ID
  line_email: ""                 # 登入 Email (選填)
  line_password: ""              # 登入密碼 (可留空，或透過 LINE_PASSWORD 環境變數提供)
  login_logo_template_path: "assets/login_line_logo.png" # 登入畫面 LINE Logo 不變錨點樣板圖
  login_button_template_path: "assets/login_button.png"  # 登入畫面 Log in 按鈕樣板圖
  login_template_path: "assets/login_email_field.png" # 登入畫面帳號欄位樣板圖 (備用)
  login_confidence: 0.45         # 登入樣板比對相似度門檻
  fullscreen: true               # 啟動後是否自動最大化並切換為全螢幕模式 (F11)

notification:
  enabled: true                  # 是否啟用 Telegram 截圖與文字通知
  telegram_bot_token: "your-telegram-bot-token" # Telegram Bot Token (或由 TELEGRAM_BOT_TOKEN 環境變數提供)
  telegram_chat_id: "your-telegram-chat-id"     # Telegram Chat ID (或由 TELEGRAM_CHAT_ID 環境變數提供)
  verification_timeout: 90       # 手機驗證碼輸入等待時間 (秒)



